<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="../../assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../assets/favicon/favicon.svg"
    />
    <link rel="shortcut icon" href="../../assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <title>PawStore - Products</title>
    <link rel-preconnect href="https://fonts.googleapis.com" />
    <link rel-preconnect href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../components/navbar/navbar.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
    <link rel="stylesheet" href="./products.css" />
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script
      type="module"
      src="../../components/navbar/navbar-config.js"
    ></script>
    <script type="module" src="./products.js"></script>
  </head>
  <body>
    <header id="header">
      <div data-component="navbar"></div>
    </header>
    <main class="entry-content">
      <aside class="aside-products-filters">
        <fieldset class="fieldset">
          <h2 class="filters-title">Filtros</h2>
          <div class="aside-checkbox-categories container border-bottom">
            <h5 class="filter-title">Categorías</h5>
            <label class="filter-value"
              ><input type="checkbox" value="8" class="category-filter" />
              <span class="category-value">Perros</span>
            </label>
            <label class="filter-value"
              ><input type="checkbox" value="9" class="category-filter" />
              <span class="category-value">Gatos</span>
            </label>
            <label class="filter-value"
              ><input type="checkbox" value="4" class="category-filter" />
              <span class="category-value">Accesorios</span>
            </label>
          </div>
        </fieldset>
      </aside>
      <section class="products-listing">
        <div class="products-header" data-component="products-header"></div>
        <div class="products-cards" data-component="products-cards"></div>
        <div class="products-pagination" data-component="pagination"></div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
